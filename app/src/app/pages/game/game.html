<app-layout>
  <span slot="header">
    Game
  </span>

    <app-word-list
      [words]="submittedWords()"
      [currentWord]="currentWord()"
    />

    <app-keyboard
      (letterPressed)="addLetter($event)"
      (deletePressed)="removeLetter()"
      (enterPressed)="submitWord()"
    />

  <span slot="footer">
    Wordle Game
  </span>
</app-layout>
